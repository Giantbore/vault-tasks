[package]
name = "vault-tasks"
version = "0.2.0"
edition = "2024"
description = "A native macOS task list for Obsidian vaults that use the Tasks plugin format"
license = "MIT"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.37.0"
global-hotkey = "0.10.0"
muda = "0.21.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
percent-encoding = "2.3.2"
regex = "1.13.1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"

[dev-dependencies]
resvg = "0.49.0"
