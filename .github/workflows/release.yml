# Builds a universal macOS app and publishes it as a GitHub Release.
# Trigger: push a version tag, e.g.  git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Run tests
        run: cargo test

      - name: Build universal app
        run: ./bundle.sh --universal --zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"; exit 1
          fi
          cat > notes.md <<'EOF'
          ## Install
          1. Download **Vault-Tasks-*-macOS.zip** below and unzip it.
          2. Drag **Vault Tasks.app** into your Applications folder.
          3. Open it. macOS will say it can't verify the developer, because the app isn't signed with an Apple Developer ID.
          4. Open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway** next to Vault Tasks. You only need to do this once.

          Works on Apple Silicon and Intel Macs running macOS 11 or later.
          EOF
          ZIP="target/Vault-Tasks-$VERSION-macOS.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Tag was re-pushed: replace the zip on the existing release.
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Vault Tasks $VERSION" --notes-file notes.md
          fi
